# A company that has just started, with the shape most of them need on day one.
#
# Copied rather than followed: `ryra org init --template ryra/default` writes
# this into a new checkout and the organization owns it from that moment. A
# template that kept reaching back would be a company whose structure somebody
# else could change.
#
# The slug and the people are yours: `ryra org people add` writes the first one.

[org]
name = "Your organization"

# Everybody, so there is somewhere to put a secret the whole company needs.
[[vaults]]
name = "Team"

# The infrastructure people's, kept apart from the start: a vault split later,
# after everything is in one, means moving secrets and re-rendering every
# machine that held them.
[[vaults]]
name = "Infra"

# The group that carries authority. Being an admin IS holding this keyring, so
# it is not a role somebody is given, it is a group they are in.
[[groups]]
name = "admins"
holds = ["Infra"]

[[groups]]
name = "everyone"
holds = ["Team"]

# One machine, declared and not bought.
#
# Declaring costs nothing: `ryra org plan` prices it and `ryra org apply` asks
# for a yes and a password before anything is created. So this is a suggestion
# you can read and edit, not a decision made on your behalf, and an earlier
# version of this file left it out on the mistaken grounds that it would spend
# money.
#
# It is also the only way the template shows what a machine declaration looks
# like: which groups get in, what it runs, where its record is sealed, and what
# it starts life as. Without one, `machines/box/` sat here referenced by nothing.
#
# Change the region and the type before applying. `ryra org machines catalog`
# lists what is actually available today, which moves: a type sold out in one
# place is available in another.
[[machines]]
name = "box"
from = "provider"
provider = "hetzner"
region = "hel1"
type = "cx23"
template = "ryra/base"
# Who can log in, and what it runs. Two axes because they only usually coincide.
access = ["admins"]
aspects = ["base"]
vault = "Infra"
